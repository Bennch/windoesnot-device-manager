name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - run: python3 -m compileall -q big-driver-manager-cli/usr/share biglinux-driver-manager/usr/share
      - run: bash -n windoesnot-device-manager pkgbuild/PKGBUILD
